<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Upload Answer Sheet</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        .upload-box {
            max-width: 700px;
            margin: 30px auto;
            padding: 25px;
            text-align: center;
        }

        .add-photo-btn {
            display: inline-block;
            border: none;
            background: #1565c0;
            color: white;
            padding: 13px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-photo-btn:hover {
            background: #0d47a1;
        }

        #fileInput {
            display: none;
        }

        .selected-count {
            margin-top: 20px;
            font-weight: bold;
            color: #1565c0;
        }

        .preview-container {
            margin-top: 20px;

            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(150px, 1fr));

            gap: 15px;
        }

        .preview-card {
            position: relative;
            background: #f1f4f8;
            padding: 8px;
            border-radius: 10px;
            overflow: hidden;
        }

        .preview-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 7px;
            display: block;
        }

        .preview-name {
            font-size: 12px;
            margin-top: 7px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .remove-photo {
            position: absolute;

            top: 5px;
            right: 5px;

            width: 28px;
            height: 28px;

            border: none;
            border-radius: 50%;

            background: #e53935;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .upload-btn {
            margin-top: 25px;

            border: none;

            background: #2e7d32;
            color: white;

            padding: 13px 28px;

            border-radius: 10px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .upload-btn:hover {
            background: #1b5e20;
        }

        .clear-btn {
            margin-top: 12px;

            border: none;

            background: #eeeeee;
            color: #333;

            padding: 10px 20px;

            border-radius: 9px;

            font-weight: bold;

            cursor: pointer;
        }

        .message {
            margin-top: 18px;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .upload-box {
                width: 94%;
                padding: 20px 15px;
            }

            .preview-container {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .preview-card img {
                height: 130px;
            }

        }

    </style>

</head>


<body>


<h1>🎓 Binod Academy</h1>


<nav>

    <a href="index.html">
        🏠 Home
    </a>

    <a href="exams.html">
        📝 Exams
    </a>

    <a href="notes.html">
        📚 Notes
    </a>

    <a href="results.html">
        📊 Results
    </a>

    <a href="contact.html">
        📞 Contact
    </a>

    <a href="login.html">
        🔐 Login
    </a>

</nav>


<section>

    <div class="upload-box">

        <h2>
            📷 Upload Answer Sheet
        </h2>

        <p>
            Add all pages of your answer sheet.
        </p>


        <!--
            IMPORTANT:
            This input allows multiple images.
        -->

        <input
            type="file"
            id="fileInput"
            accept="image/*"
            multiple>


        <!-- ADD PHOTOS -->

        <button
            type="button"
            id="addPhotoButton"
            class="add-photo-btn">

            📷 Add Photos

        </button>


        <!-- COUNT -->

        <div
            id="selectedCount"
            class="selected-count">

            No photos selected.

        </div>


        <!-- PREVIEWS -->

        <div
            id="previewContainer"
            class="preview-container">
        </div>


        <!-- UPLOAD -->

        <button
            type="button"
            id="uploadButton"
            class="upload-btn">

            📤 Upload Answer Sheet

        </button>


        <!-- CLEAR -->

        <br>

        <button
            type="button"
            id="clearButton"
            class="clear-btn">

            🗑️ Clear All

        </button>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
        </div>

    </div>

</section>


<script>

/* =====================================================
   VARIABLES
===================================================== */

let selectedFiles = [];


/* =====================================================
   ELEMENTS
===================================================== */

const fileInput =
    document.getElementById(
        "fileInput"
    );

const addPhotoButton =
    document.getElementById(
        "addPhotoButton"
    );

const uploadButton =
    document.getElementById(
        "uploadButton"
    );

const clearButton =
    document.getElementById(
        "clearButton"
    );

const previewContainer =
    document.getElementById(
        "previewContainer"
    );

const selectedCount =
    document.getElementById(
        "selectedCount"
    );

const message =
    document.getElementById(
        "message"
    );


/* =====================================================
   ADD PHOTO BUTTON
===================================================== */

addPhotoButton.addEventListener(
    "click",
    function () {

        fileInput.click();

    }
);


/* =====================================================
   FILE SELECTION
===================================================== */

fileInput.addEventListener(
    "change",
    function () {

        const files =
            Array.from(
                fileInput.files
            );


        if (files.length === 0) {
            return;
        }


        files.forEach(
            function (file) {

                /*
                 * Only images allowed.
                 */

                if (
                    !file.type.startsWith(
                        "image/"
                    )
                ) {
                    return;
                }


                /*
                 * Prevent duplicate files.
                 */

                const duplicate =
                    selectedFiles.some(
                        function (oldFile) {

                            return (
                                oldFile.name === file.name &&
                                oldFile.size === file.size &&
                                oldFile.lastModified === file.lastModified
                            );

                        }
                    );


                if (!duplicate) {

                    selectedFiles.push(
                        file
                    );

                }

            }
        );


        /*
         * VERY IMPORTANT:
         *
         * Reset the real input.
         *
         * This allows you to click
         * "Add Photos" again and
         * select more pictures.
         */

        fileInput.value = "";


        updatePreview();

    }
);


/* =====================================================
   DISPLAY PHOTOS
===================================================== */

function updatePreview() {

    previewContainer.innerHTML = "";


    if (
        selectedFiles.length === 0
    ) {

        selectedCount.textContent =
            "No photos selected.";

        return;

    }


    selectedCount.textContent =
        "📷 " +
        selectedFiles.length +
        " photo(s) selected";


    selectedFiles.forEach(
        function (file, index) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "preview-card";


            const image =
                document.createElement(
                    "img"
                );


            const imageURL =
                URL.createObjectURL(
                    file
                );


            image.src =
                imageURL;


            image.onload =
                function () {

                    URL.revokeObjectURL(
                        imageURL
                    );

                };


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "preview-name";

            name.textContent =
                (index + 1) +
                ". " +
                file.name;


            const removeButton =
                document.createElement(
                    "button"
                );

            removeButton.type =
                "button";

            removeButton.className =
                "remove-photo";

            removeButton.textContent =
                "×";


            removeButton.title =
                "Remove this photo";


            removeButton.addEventListener(
                "click",
                function () {

                    selectedFiles.splice(
                        index,
                        1
                    );

                    updatePreview();

                }
            );


            card.appendChild(
                image
            );

            card.appendChild(
                name
            );

            card.appendChild(
                removeButton
            );


            previewContainer.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   CLEAR ALL
===================================================== */

clearButton.addEventListener(
    "click",
    function () {

        selectedFiles = [];

        fileInput.value = "";

        updatePreview();

        message.textContent = "";

    }
);


/* =====================================================
   UPLOAD BUTTON
===================================================== */

uploadButton.addEventListener(
    "click",
    function () {

        if (
            selectedFiles.length === 0
        ) {

            message.textContent =
                "⚠️ Please add answer-sheet photos first.";

            message.style.color =
                "#c62828";

            return;

        }


        /*
         * All selected images are
         * stored here:
         *
         * selectedFiles
         *
         * Example:
         *
         * Page 1
         * Page 2
         * Page 3
         * Page 4
         *
         * They are all preserved.
         */


        message.textContent =
            "✅ " +
            selectedFiles.length +
            " answer-sheet photo(s) selected successfully.";

        message.style.color =
            "#2e7d32";

    }
);

</script>


</body>

</html>
