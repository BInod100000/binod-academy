<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Answer Sheet</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .upload-box {
            max-width: 650px;
            margin: 30px auto;
            padding: 25px;
            text-align: center;
        }

        .file-input {
            display: none;
        }

        .select-btn {
            display: inline-block;
            background: #1565c0;
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .select-btn:hover {
            background: #0d47a1;
        }

        .file-list {
            margin-top: 20px;
            text-align: left;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;

            background: #f1f4f8;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .file-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .remove-btn {
            border: none;
            background: #e53935;
            color: white;
            padding: 6px 10px;
            border-radius: 7px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .upload-btn {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #1565c0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .upload-btn:hover {
            background: #0d47a1;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>


<body>

<h1>🎓 Binod Academy</h1>

<nav>

    <a href="index.html">🏠 Home</a>

    <a href="exams.html">📝 Exams</a>

    <a href="notes.html">📚 Notes</a>

    <a href="results.html">📊 Results</a>

    <a href="contact.html">📞 Contact</a>

    <a href="login.html">🔐 Login</a>

</nav>


<section>

    <div class="upload-box">

        <h2>📷 Upload Answer Sheet</h2>

        <p>
            Select all photos of your answer sheet.
        </p>


        <!-- HIDDEN FILE INPUT -->

        <input
            type="file"
            id="answerFiles"
            class="file-input"
            accept="image/jpeg,image/png,image/webp,image/jpg"
            multiple
        >


        <!-- ADD PHOTOS BUTTON -->

        <label
            for="answerFiles"
            class="select-btn">

            📷 Add Photos

        </label>


        <!-- SELECTED FILES -->

        <div
            id="fileList"
            class="file-list">
        </div>


        <!-- UPLOAD -->

        <button
            type="button"
            id="uploadButton"
            class="upload-btn">

            📤 Upload Answer Sheet

        </button>


        <div
            id="message"
            class="message">
        </div>

    </div>

</section>


<script>

/* =====================================================
   VARIABLES
===================================================== */

let selectedFiles = [];


/* =====================================================
   ELEMENTS
===================================================== */

const answerFiles =
    document.getElementById("answerFiles");

const fileList =
    document.getElementById("fileList");

const uploadButton =
    document.getElementById("uploadButton");

const message =
    document.getElementById("message");


/* =====================================================
   ADD PHOTOS
===================================================== */

answerFiles.addEventListener(
    "change",
    function () {

        const newFiles =
            Array.from(answerFiles.files);


        /*
         * Add newly selected files
         * without removing previous files.
         */

        newFiles.forEach(
            function (file) {

                const alreadyExists =
                    selectedFiles.some(
                        function (existingFile) {

                            return (
                                existingFile.name === file.name &&
                                existingFile.size === file.size &&
                                existingFile.lastModified === file.lastModified
                            );

                        }
                    );


                if (!alreadyExists) {

                    selectedFiles.push(file);

                }

            }
        );


        /*
         * Clear input so the SAME
         * photo can also be selected
         * again if needed.
         */

        answerFiles.value = "";


        displayFiles();

    }
);


/* =====================================================
   DISPLAY FILES
===================================================== */

function displayFiles() {

    fileList.innerHTML = "";


    if (selectedFiles.length === 0) {

        return;

    }


    const heading =
        document.createElement("p");

    heading.innerHTML =
        "<strong>📷 " +
        selectedFiles.length +
        " image(s) selected</strong>";

    fileList.appendChild(
        heading
    );


    selectedFiles.forEach(
        function (file, index) {

            const item =
                document.createElement("div");

            item.className =
                "file-item";


            const name =
                document.createElement("span");

            name.className =
                "file-name";

            name.textContent =
                (index + 1) +
                ". " +
                file.name;


            const remove =
                document.createElement("button");

            remove.type =
                "button";

            remove.className =
                "remove-btn";

            remove.textContent =
                "✕ Remove";


            remove.addEventListener(
                "click",
                function () {

                    selectedFiles.splice(
                        index,
                        1
                    );

                    displayFiles();

                }
            );


            item.appendChild(
                name
            );

            item.appendChild(
                remove
            );


            fileList.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   UPLOAD BUTTON
===================================================== */

uploadButton.addEventListener(
    "click",
    function () {

        if (selectedFiles.length === 0) {

            message.textContent =
                "⚠️ Please select at least one answer-sheet image.";

            message.style.color =
                "#c62828";

            return;

        }


        /*
         * All selected images are now
         * available inside selectedFiles.
         *
         * Your actual Supabase upload
         * can use this array.
         */

        message.textContent =
            "✅ " +
            selectedFiles.length +
            " image(s) selected and ready to upload.";

        message.style.color =
            "#2e7d32";

    }
);

</script>

</body>

</html>
