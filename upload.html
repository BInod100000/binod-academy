<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Answer Sheet</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .upload-box {
            max-width: 650px;
            margin: 30px auto;
            padding: 25px;
            text-align: center;
        }

        .file-input {
            width: 100%;
            padding: 15px;
            border: 2px dashed #1565c0;
            border-radius: 12px;
            background: #f5f9ff;
            cursor: pointer;
        }

        .file-list {
            margin-top: 20px;
            text-align: left;
        }

        .file-item {
            background: #f1f4f8;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 8px;
            word-break: break-word;
        }

        .upload-btn {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #1565c0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .upload-btn:hover {
            background: #0d47a1;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>🎓 Binod Academy</h1>

<nav>

    <a href="index.html">🏠 Home</a>

    <a href="exams.html">📝 Exams</a>

    <a href="notes.html">📚 Notes</a>

    <a href="results.html">📊 Results</a>

    <a href="contact.html">📞 Contact</a>

    <a href="login.html">🔐 Login</a>

</nav>

<section>

    <div class="upload-box">

        <h2>📷 Upload Answer Sheet</h2>

        <p>
            Select all photos of your answer sheet at once.
        </p>

        <!-- MULTIPLE IMAGE SELECT -->
        <input
            type="file"
            id="answerFiles"
            class="file-input"
            accept="image/*"
            multiple
        >

        <div
            id="fileList"
            class="file-list">
        </div>

        <button
            type="button"
            id="uploadButton"
            class="upload-btn">

            📤 Upload Answer Sheet

        </button>

        <div
            id="message"
            class="message">
        </div>

    </div>

</section>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const answerFiles =
    document.getElementById("answerFiles");

const fileList =
    document.getElementById("fileList");

const uploadButton =
    document.getElementById("uploadButton");

const message =
    document.getElementById("message");


/* =====================================================
   SHOW SELECTED FILES
===================================================== */

answerFiles.addEventListener(
    "change",
    function () {

        fileList.innerHTML = "";

        const files =
            Array.from(answerFiles.files);

        if (files.length === 0) {

            return;

        }


        const heading =
            document.createElement("p");

        heading.innerHTML =
            "<strong>" +
            files.length +
            " image(s) selected</strong>";

        fileList.appendChild(
            heading
        );


        files.forEach(
            function (file, index) {

                const item =
                    document.createElement("div");

                item.className =
                    "file-item";

                item.textContent =
                    "📷 " +
                    (index + 1) +
                    ". " +
                    file.name;

                fileList.appendChild(
                    item
                );

            }
        );

    }
);


/* =====================================================
   UPLOAD BUTTON
===================================================== */

uploadButton.addEventListener(
    "click",
    function () {

        const files =
            Array.from(answerFiles.files);


        if (files.length === 0) {

            message.textContent =
                "⚠️ Please select answer-sheet images first.";

            message.style.color =
                "#c62828";

            return;
        }


        /*
         * At this stage the selected files are ready
         * as a MULTIPLE-FILE collection.
         *
         * Your existing upload/storage system can
         * use answerFiles.files without changing
         * the rest of the website.
         */

        message.textContent =
            "✅ " +
            files.length +
            " image(s) selected and ready to upload.";

        message.style.color =
            "#2e7d32";

    }
);

</script>

</body>
</html>
