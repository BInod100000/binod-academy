<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Binod Academy - Teacher Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">

    <h1>🎓 Binod Academy</h1>


    <nav>

        <a href="index.html">
            🏠 Home
        </a>

        <!-- HIDDEN UNTIL TEACHER LOGIN -->
        <a
            href="exams.html"
            id="examsLink"
            style="display: none;"
        >
            📝 Exams
        </a>

        <a href="notes.html">
            📚 Notes
        </a>

        <!-- HIDDEN UNTIL TEACHER LOGIN -->
        <a
            href="results.html"
            id="resultsLink"
            style="display: none;"
        >
            📊 Results
        </a>

        <a href="contact.html">
            📞 Contact
        </a>

        <a href="login.html">
            🔐 Login
        </a>

    </nav>


    <section>

        <div class="login-box">

            <h2>👨‍🏫 Teacher Login</h2>

            <p>
                Enter your Teacher ID and Password.
            </p>


            <!-- TEACHER ID -->

            <input
                type="text"
                id="teacherId"
                placeholder="Teacher ID"
                autocomplete="username"
            >


            <!-- PASSWORD -->

            <input
                type="password"
                id="teacherPassword"
                placeholder="Password"
                autocomplete="current-password"
            >


            <br><br>


            <!-- ORIGINAL TEACHER LOGIN -->

            <button onclick="teacherLogin()">
                Teacher Login
            </button>


            <!-- ERROR MESSAGE -->

            <p
                id="teacherError"
                style="color:red; margin-top:15px;"
            ></p>


        </div>

    </section>


    <!-- =====================================
         SUPABASE LIBRARY
    ====================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =====================================
         SUPABASE CONNECTION
    ====================================== -->

    <script>

        const SUPABASE_URL =
            "https://zapjcweouiohabrmymqq.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_LzpPYJfrnh604E-guWCezA_mzZjaS6x";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

    </script>


    <!-- =====================================
         ORIGINAL WEBSITE JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>


    <!-- =====================================
         NAVIGATION VISIBILITY ONLY
    ====================================== -->

    <script>

        const loggedInTeacher =
            localStorage.getItem("loggedInTeacher");


        const examsLink =
            document.getElementById("examsLink");

        const resultsLink =
            document.getElementById("resultsLink");


        /*
         * Only show Exams and Results
         * if a teacher is already logged in.
         */

        if (loggedInTeacher) {

            examsLink.style.display =
                "inline-block";

            resultsLink.style.display =
                "inline-block";

        }

    </script>


</body>

</html>
