<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Binod Academy - Student Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">

    <h1>🎓 Binod Academy</h1>


    <nav>

        <a href="index.html">
            🏠 Home
        </a>

        <!-- HIDDEN BEFORE STUDENT LOGIN -->
        <a
            href="exams.html"
            id="examsLink"
            style="display: none;"
        >
            📝 Exams
        </a>

        <a href="notes.html">
            📚 Notes
        </a>

        <!-- HIDDEN BEFORE STUDENT LOGIN -->
        <a
            href="results.html"
            id="resultsLink"
            style="display: none;"
        >
            📊 Results
        </a>

        <a href="contact.html">
            📞 Contact
        </a>

        <a
            href="login.html"
            id="loginLink"
        >
            🔐 Login
        </a>

        <!-- HIDDEN BEFORE LOGIN -->
        <a
            href="#"
            id="logoutLink"
            style="display: none;"
        >
            🚪 Logout
        </a>

    </nav>


    <section>

        <div class="login-box">

            <h2>👨‍🎓 Student Login</h2>

            <p>
                Enter your Student ID and Password.
            </p>


            <!-- STUDENT ID -->

            <input
                type="text"
                id="studentId"
                placeholder="Student ID"
                autocomplete="username"
            >


            <!-- PASSWORD -->

            <input
                type="password"
                id="studentPassword"
                placeholder="Password"
                autocomplete="current-password"
            >


            <br><br>


            <!-- LOGIN BUTTON -->

            <button onclick="studentLogin()">
                👨‍🎓 Student Login
            </button>


            <!-- ERROR MESSAGE -->

            <p
                id="studentError"
                style="color:red; margin-top:15px;"
            ></p>


        </div>

    </section>


    <!-- =====================================
         SUPABASE LIBRARY
    ====================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =====================================
         SUPABASE CONNECTION
    ====================================== -->

    <script>

        const SUPABASE_URL =
            "https://zapjcweouiohabrmymqq.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_LzpPYJfrnh604E-guWCezA_mzZjaS6x";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

    </script>


    <!-- =====================================
         WEBSITE JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>


    <!-- =====================================
         NAVIGATION VISIBILITY
         DO NOT AFFECT LOGIN SYSTEM
    ====================================== -->

    <script>

        const loggedInStudent =
            localStorage.getItem("loggedInStudent");


        const examsLink =
            document.getElementById("examsLink");

        const resultsLink =
            document.getElementById("resultsLink");

        const loginLink =
            document.getElementById("loginLink");

        const logoutLink =
            document.getElementById("logoutLink");


        /*
         * BEFORE LOGIN:
         * Exams and Results remain hidden.
         *
         * AFTER LOGIN:
         * Exams and Results become visible.
         */

        if (loggedInStudent) {

            examsLink.style.display =
                "inline-block";

            resultsLink.style.display =
                "inline-block";

            loginLink.style.display =
                "none";

            logoutLink.style.display =
                "inline-block";
        }


        /* =====================================
           LOGOUT
        ====================================== */

        logoutLink.addEventListener(
            "click",
            function(event) {

                event.preventDefault();


                localStorage.removeItem(
                    "loggedInStudent"
                );

                localStorage.removeItem(
                    "loggedInTeacher"
                );

                localStorage.removeItem(
                    "teacherName"
                );


                window.location.href =
                    "index.html";

            }
        );

    </script>


</body>

</html>
