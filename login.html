<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Binod Academy - Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Hide login-only navigation until login */
        #examsLink,
        #resultsLink,
        #logoutLink {
            display: none !important;
        }
    </style>
</head>

<body>

    <h1>🎓 Binod Academy</h1>

    <nav>

        <!-- ALWAYS VISIBLE -->

        <a href="index.html">
            🏠 Home
        </a>

        <a href="notes.html">
            📚 Notes
        </a>

        <a href="contact.html">
            📞 Contact
        </a>


        <!-- ONLY AFTER LOGIN -->

        <a href="exams.html" id="examsLink">
            📝 Exams
        </a>

        <a href="results.html" id="resultsLink">
            📊 Results
        </a>


        <!-- LOGIN -->

        <a href="login.html" id="loginLink">
            🔐 Login
        </a>


        <!-- LOGOUT -->

        <a href="#" id="logoutLink">
            🚪 Logout
        </a>

    </nav>

    <section>

        <div class="login-box">

            <h2>🔐 Choose Login</h2>

            <p>Select your account type.</p>

            <div class="subjects">

                <!-- ============================= -->
                <!-- TEACHER PORTAL -->
                <!-- ============================= -->

                <div class="card">

                    <h2>👨‍🏫 Teacher Portal</h2>

                    <p>
                        Login to check answer sheets
                        and publish results.
                    </p>

                    <a href="teacher-login.html">
                        <button type="button">
                            👨‍🏫 Teacher Login
                        </button>
                    </a>

                </div>


                <!-- ============================= -->
                <!-- STUDENT PORTAL -->
                <!-- ============================= -->

                <div class="card">

                    <h2>👨‍🎓 Student Portal</h2>

                    <p>
                        Login to start exams
                        and view your results.
                    </p>

                    <a href="student-login.html">
                        <button type="button">
                            👨‍🎓 Student Login
                        </button>
                    </a>

                </div>

            </div>

        </div>

    </section>


    <script>

        /* =====================================================
           LOGIN STATUS
        ===================================================== */

        const loggedInStudent =
            localStorage.getItem("loggedInStudent");

        const loggedInTeacher =
            localStorage.getItem("loggedInTeacher");


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const examsLink =
            document.getElementById("examsLink");

        const resultsLink =
            document.getElementById("resultsLink");

        const loginLink =
            document.getElementById("loginLink");

        const logoutLink =
            document.getElementById("logoutLink");


        /* =====================================================
           DEFAULT
        ===================================================== */

        examsLink.style.display = "none";
        resultsLink.style.display = "none";
        logoutLink.style.display = "none";
        loginLink.style.display = "inline-block";


        /* =====================================================
           SHOW AFTER LOGIN
        ===================================================== */

        if (
            (loggedInStudent &&
             loggedInStudent !== "null" &&
             loggedInStudent !== "undefined")
            ||
            (loggedInTeacher &&
             loggedInTeacher !== "null" &&
             loggedInTeacher !== "undefined")
        ) {

            examsLink.style.display =
                "inline-block";

            resultsLink.style.display =
                "inline-block";

            loginLink.style.display =
                "none";

            logoutLink.style.display =
                "inline-block";
        }


        /* =====================================================
           LOGOUT
        ===================================================== */

        logoutLink.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                localStorage.removeItem(
                    "loggedInStudent"
                );

                localStorage.removeItem(
                    "loggedInTeacher"
                );

                localStorage.removeItem(
                    "teacherName"
                );

                window.location.replace(
                    "index.html"
                );

            }
        );

    </script>

</body>

</html>
