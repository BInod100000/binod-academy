<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">

<style>
@media screen and (max-width: 768px) {

    .student-login-page nav {
        display: none !important;
    }

    .student-login-page {
        padding: 10px !important;
        min-height: auto !important;
    }

    .student-login-page section {
        width: 100% !important;
        margin: 10px auto !important;
        padding: 10px !important;
    }

    .student-login-page .login-box {
        width: 100% !important;
        max-width: 450px !important;
        margin: 10px auto !important;
        padding: 20px 15px !important;
    }

    .student-login-page input {
        width: 100% !important;
        max-width: 350px !important;
        height: 50px !important;
        font-size: 17px !important;
    }

    .student-login-page button {
        width: 100% !important;
        max-width: 250px !important;
    }
}
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Binod Academy - Student Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <h1>🎓 Binod Academy</h1>

    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="exams.html">📝 Exams</a>
        <a href="notes.html">📚 Notes</a>
        <a href="results.html">📊 Results</a>
        <a href="contact.html">📞 Contact</a>
        <a href="login.html">🔐 Login</a>
    </nav>

    <section>

        <div class="login-box">

            <h2>👨‍🎓 Student Login</h2>

            <p>Enter your Student ID and Password.</p>

            <input
                type="text"
                id="studentId"
                placeholder="Student ID"
                autocomplete="username"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button onclick="login()">
                Login
            </button>

            <p id="error" style="color:red; margin-top:15px;"></p>

            <p style="margin-top:20px;">
                Don't have an account?
                <a href="student-registration.html">
                    Register here
                </a>
            </p>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
