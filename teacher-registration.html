<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Binod Academy - Teacher Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <h1>🎓 Binod Academy</h1>

    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="exams.html">📝 Exams</a>
        <a href="notes.html">📚 Notes</a>
        <a href="results.html">📊 Results</a>
        <a href="contact.html">📞 Contact</a>
        <a href="login.html">🔐 Login</a>
    </nav>

    <section>

        <div class="login-box">

            <h2>👨‍🏫 Teacher Registration</h2>

            <p>Create your teacher account.</p>

            <input
                type="text"
                id="teacherName"
                placeholder="Enter Your Full Name"
                autocomplete="name"
                oninput="this.value = this.value.toUpperCase()"
            >

            <input
                type="password"
                id="newTeacherPassword"
                placeholder="Create Password"
                autocomplete="new-password"
            >

            <input
                type="password"
                id="confirmTeacherPassword"
                placeholder="Retype Password"
                autocomplete="new-password"
            >

            <button onclick="registerTeacher()">
                Create Teacher Account
            </button>

            <p
                id="teacherRegisterError"
                style="color:red; margin-top:15px;"
            ></p>

            <p style="margin-top:20px;">
                Already have an account?
                <a href="teacher-login.html">
                    Login here
                </a>
            </p>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
