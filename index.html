<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Binod Academy</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<h1>🎓 Binod Academy</h1>

<p>
    <b>Learn • Practice • Succeed</b>
</p>

<hr>


<nav>

    <a href="index.html">
        🏠 Home
    </a>

    <a href="notes.html">
        📚 Notes
    </a>

    <a href="contact.html">
        📞 Contact
    </a>

    <!-- HIDDEN UNTIL LOGIN -->

    <a
        href="exams.html"
        id="examsLink"
        style="display:none;">

        📝 Exams

    </a>


    <a
        href="results.html"
        id="resultsLink"
        style="display:none;">

        📊 Results

    </a>


    <!-- LOGIN -->

    <a
        href="login.html"
        id="loginLink">

        🔐 Login

    </a>


    <!-- LOGOUT -->

    <a
        href="#"
        id="logoutLink"
        style="display:none;">

        🚪 Logout

    </a>

</nav>

<hr>


<section>

    <h2>
        Welcome Students!
    </h2>

    <p>
        Prepare well for your exams and achieve your goals.
        Your success journey starts here.
    </p>

</section>


<h2>
    📚 Our Subjects
</h2>


<div class="subjects">

    <div class="card">
        📘 Mathematics
    </div>

    <div class="card">
        🔬 Science
    </div>

    <div class="card">
        📐 Optional Mathematics
    </div>

    <div class="card">
        💻 Computer
    </div>

    <div class="card">
        📖 English
    </div>

</div>


<script>

/* =====================================================
   LOGIN STATUS
===================================================== */

const loggedInStudent =
    localStorage.getItem(
        "loggedInStudent"
    );

const loggedInTeacher =
    localStorage.getItem(
        "loggedInTeacher"
    );


const examsLink =
    document.getElementById(
        "examsLink"
    );

const resultsLink =
    document.getElementById(
        "resultsLink"
    );

const loginLink =
    document.getElementById(
        "loginLink"
    );

const logoutLink =
    document.getElementById(
        "logoutLink"
    );


/* =====================================================
   ONLY SHOW AFTER LOGIN
===================================================== */

if (
    loggedInStudent ||
    loggedInTeacher
) {

    examsLink.style.display =
        "inline-block";

    resultsLink.style.display =
        "inline-block";

    loginLink.style.display =
        "none";

    logoutLink.style.display =
        "inline-block";

}


/* =====================================================
   LOGOUT
===================================================== */

logoutLink.addEventListener(
    "click",
    function(event) {

        event.preventDefault();


        localStorage.removeItem(
            "loggedInStudent"
        );

        localStorage.removeItem(
            "loggedInTeacher"
        );

        localStorage.removeItem(
            "teacherName"
        );


        window.location.href =
            "index.html";

    }
);

</script>


</body>

</html>
