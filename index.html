<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Binod Academy</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================================
           EXAMS & RESULTS ARE HIDDEN BY DEFAULT
        ===================================================== */

        #examsLink,
        #resultsLink,
        #logoutLink {
            display: none !important;
        }
    </style>
</head>

<body>

<h1>🎓 Binod Academy</h1>

<p><b>Learn • Practice • Succeed</b></p>

<hr>

<nav>

    <!-- ALWAYS VISIBLE -->

    <a href="index.html">
        🏠 Home
    </a>

    <a href="notes.html">
        📚 Notes
    </a>

    <a href="contact.html">
        📞 Contact
    </a>


    <!-- HIDDEN UNTIL LOGIN -->

    <a href="exams.html" id="examsLink">
        📝 Exams
    </a>

    <a href="results.html" id="resultsLink">
        📊 Results
    </a>


    <!-- LOGIN -->

    <a href="login.html" id="loginLink">
        🔐 Login
    </a>


    <!-- LOGOUT -->

    <a href="#" id="logoutLink">
        🚪 Logout
    </a>

</nav>

<hr>


<!-- =========================
     WELCOME
========================= -->

<section>

    <h2>Welcome Students!</h2>

    <p>
        Prepare well for your exams and achieve your goals.
        Your success journey starts here.
    </p>

</section>


<!-- =========================
     SUBJECTS
========================= -->

<h2>📚 Our Subjects</h2>

<div class="subjects">

    <div class="card">
        📘 Mathematics
    </div>

    <div class="card">
        🔬 Science
    </div>

    <div class="card">
        📐 Optional Mathematics
    </div>

    <div class="card">
        💻 Computer
    </div>

    <div class="card">
        📖 English
    </div>

</div>


<script>

/* =====================================================
   GET LOGIN INFORMATION
===================================================== */

const studentLogin =
    localStorage.getItem("loggedInStudent");

const teacherLogin =
    localStorage.getItem("loggedInTeacher");


/* =====================================================
   GET NAVIGATION ITEMS
===================================================== */

const examsLink =
    document.getElementById("examsLink");

const resultsLink =
    document.getElementById("resultsLink");

const loginLink =
    document.getElementById("loginLink");

const logoutLink =
    document.getElementById("logoutLink");


/* =====================================================
   DEFAULT STATE
===================================================== */

/*
   EVERYTHING REQUIRING LOGIN IS HIDDEN.
*/

examsLink.style.setProperty(
    "display",
    "none",
    "important"
);

resultsLink.style.setProperty(
    "display",
    "none",
    "important"
);

logoutLink.style.setProperty(
    "display",
    "none",
    "important"
);

loginLink.style.setProperty(
    "display",
    "inline-block",
    "important"
);


/* =====================================================
   CHECK WHETHER USER IS REALLY LOGGED IN
===================================================== */

const studentIsLoggedIn =
    studentLogin !== null &&
    studentLogin !== "" &&
    studentLogin !== "null" &&
    studentLogin !== "undefined";

const teacherIsLoggedIn =
    teacherLogin !== null &&
    teacherLogin !== "" &&
    teacherLogin !== "null" &&
    teacherLogin !== "undefined";


/* =====================================================
   SHOW AFTER LOGIN
===================================================== */

if (
    studentIsLoggedIn ||
    teacherIsLoggedIn
) {

    /* SHOW EXAMS */

    examsLink.style.setProperty(
        "display",
        "inline-block",
        "important"
    );


    /* SHOW RESULTS */

    resultsLink.style.setProperty(
        "display",
        "inline-block",
        "important"
    );


    /* HIDE LOGIN */

    loginLink.style.setProperty(
        "display",
        "none",
        "important"
    );


    /* SHOW LOGOUT */

    logoutLink.style.setProperty(
        "display",
        "inline-block",
        "important"
    );
}


/* =====================================================
   LOGOUT
===================================================== */

logoutLink.addEventListener(
    "click",
    function(event) {

        event.preventDefault();


        localStorage.removeItem(
            "loggedInStudent"
        );

        localStorage.removeItem(
            "loggedInTeacher"
        );

        localStorage.removeItem(
            "teacherName"
        );


        /* Return to Home */

        window.location.replace(
            "index.html"
        );

    }
);

</script>

</body>
</html>
