<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Binod Academy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🎓 Binod Academy</h1>

<p><b>Learn • Practice • Succeed</b></p>

<hr>

<nav>

    <!-- ALWAYS VISIBLE -->

    <a href="index.html">🏠 Home</a>

    <a href="notes.html">📚 Notes</a>

    <a href="contact.html">📞 Contact</a>


    <!-- ONLY VISIBLE AFTER LOGIN -->

    <a
        href="exams.html"
        id="examsLink"
        style="display: none;">
        📝 Exams
    </a>

    <a
        href="results.html"
        id="resultsLink"
        style="display: none;">
        📊 Results
    </a>


    <!-- LOGIN -->

    <a
        href="login.html"
        id="loginLink">
        🔐 Login
    </a>


    <!-- LOGOUT -->

    <a
        href="#"
        id="logoutLink"
        style="display: none;">
        🚪 Logout
    </a>

</nav>

<hr>


<!-- =========================
     WELCOME
========================= -->

<section>

    <h2>Welcome Students!</h2>

    <p>
        Prepare well for your exams and achieve your goals.
        Your success journey starts here.
    </p>

</section>


<!-- =========================
     SUBJECTS
========================= -->

<h2>📚 Our Subjects</h2>

<div class="subjects">

    <div class="card">
        📘 Mathematics
    </div>

    <div class="card">
        🔬 Science
    </div>

    <div class="card">
        📐 Optional Mathematics
    </div>

    <div class="card">
        💻 Computer
    </div>

    <div class="card">
        📖 English
    </div>

</div>


<script>

/* =====================================================
   CHECK LOGIN STATUS
===================================================== */

const loggedInStudent =
    localStorage.getItem("loggedInStudent");

const loggedInTeacher =
    localStorage.getItem("loggedInTeacher");


/* =====================================================
   GET NAVIGATION ELEMENTS
===================================================== */

const examsLink =
    document.getElementById("examsLink");

const resultsLink =
    document.getElementById("resultsLink");

const loginLink =
    document.getElementById("loginLink");

const logoutLink =
    document.getElementById("logoutLink");


/* =====================================================
   BEFORE LOGIN
===================================================== */

/*
   Exams and Results remain hidden.
   Login remains visible.
*/


/* =====================================================
   AFTER STUDENT OR TEACHER LOGIN
===================================================== */

if (
    loggedInStudent ||
    loggedInTeacher
) {

    /* Show Exams */

    examsLink.style.display =
        "inline-block";


    /* Show Results */

    resultsLink.style.display =
        "inline-block";


    /* Hide Login */

    loginLink.style.display =
        "none";


    /* Show Logout */

    logoutLink.style.display =
        "inline-block";
}


/* =====================================================
   LOGOUT
===================================================== */

logoutLink.addEventListener(
    "click",
    function(event) {

        event.preventDefault();


        /* Remove student login */

        localStorage.removeItem(
            "loggedInStudent"
        );


        /* Remove teacher login */

        localStorage.removeItem(
            "loggedInTeacher"
        );


        /* Remove teacher name */

        localStorage.removeItem(
            "teacherName"
        );


        /* Return to Home */

        window.location.href =
            "index.html";

    }
);

</script>

</body>
</html>
