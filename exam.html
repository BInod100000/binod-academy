<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Binod Academy - Exam</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .exam-container {
            max-width: 900px;
            margin: 30px auto;
        }

        .exam-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .exam-title {
            color: #1565c0;
            margin-bottom: 20px;
        }

        .exam-info {
            font-size: 19px;
            line-height: 1.8;
        }

        #timer {
            font-size: 32px;
            font-weight: bold;
            margin: 25px 0;
        }

        #startExamButton {
            background: #1565c0;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        #startExamButton:hover {
            background: #0d47a1;
        }

        #startExamButton:disabled {
            background: #777;
            cursor: not-allowed;
        }

        #questionPaperArea {
            display: none;
            margin-top: 30px;
        }

        .question-paper-box {
            background: #f5f7fb;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #ddd;
        }

        .page-counter {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #1565c0;
        }

        .slideshow-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .slide-button {
            border: none;
            color: white;
            padding: 13px 22px;
            font-size: 17px;
            border-radius: 8px;
            cursor: pointer;
        }

        .previous-button {
            background: #777;
        }

        .previous-button:hover {
            background: #555;
        }

        .next-button {
            background: #1565c0;
        }

        .next-button:hover {
            background: #0d47a1;
        }

        .slideshow-button {
            background: #2e7d32;
        }

        .slideshow-button:hover {
            background: #1b5e20;
        }

        .stop-button {
            background: #d32f2f;
        }

        .stop-button:hover {
            background: #b71c1c;
        }

        .question-image-wrapper {
            background: white;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }

        #questionPageImage {
            max-width: 100%;
            max-height: 800px;
            width: auto;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 10px;
            border: 2px solid #ddd;
        }

        #questionPdf {
            width: 100%;
            height: 750px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }

        .instructions {
            background: #f5f7fb;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            line-height: 1.7;
            margin-top: 25px;
            white-space: pre-line;
        }

        .message {
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0;
        }

        .back-button {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
        }

        .loading-message {
            text-align: center;
            font-size: 18px;
            padding: 30px;
        }

        .error-message {
            color: red;
            text-align: center;
            font-weight: bold;
            padding: 20px;
        }

        @media (max-width: 600px) {

            .exam-card {
                padding: 20px;
            }

            .exam-info {
                font-size: 17px;
            }

            #timer {
                font-size: 27px;
            }

            #startExamButton {
                width: 100%;
            }

            .slide-button {
                width: 100%;
            }

            #questionPageImage {
                max-height: 650px;
            }

        }

    </style>

</head>


<body>

    <h1>🎓 Binod Academy</h1>


    <nav>

        <a href="index.html">
            🏠 Home
        </a>

        <a href="exams.html">
            📝 Exams
        </a>

        <a href="notes.html">
            📚 Notes
        </a>

        <a href="results.html">
            📊 Results
        </a>

        <a href="contact.html">
            📞 Contact
        </a>

        <a href="login.html">
            🔐 Login
        </a>

    </nav>


    <section class="exam-container">

        <div class="exam-card">

            <h2
                id="examTitle"
                class="exam-title"
            >
                ⏳ Loading exam...
            </h2>


            <div
                id="examMessage"
                class="message"
            ></div>


            <div
                id="examContent"
                style="display: none;"
            >

                <div class="exam-info">

                    <p>
                        📚
                        <strong>Subject:</strong>
                        <span id="examSubject"></span>
                    </p>

                    <p>
                        📅
                        <strong>Exam Date:</strong>
                        <span id="examDate"></span>
                    </p>

                    <p>
                        ⏱️
                        <strong>Duration:</strong>
                        <span id="examDuration"></span>
                    </p>

                    <p>
                        📊
                        <strong>Total Marks:</strong>
                        <span id="totalMarks"></span>
                    </p>

                </div>


                <div class="instructions">

                    <strong>
                        📜 Examination Instructions
                    </strong>

                    <p id="examInstructions"></p>

                </div>


                <br>


                <p>
                    Read all instructions carefully before starting.
                </p>


                <button id="startExamButton">
                    ▶️ Start Exam
                </button>


                <p id="timer">
                    00:00:00
                </p>


                <!-- QUESTION PAPER -->

                <div id="questionPaperArea">

                    <h2>
                        📄 Question Paper
                    </h2>


                    <div class="question-paper-box">

                        <!-- PAGE COUNTER -->

                        <div class="page-counter">

                            Page
                            <span id="currentPageNumber">
                                1
                            </span>

                            of

                            <span id="totalPageNumber">
                                1
                            </span>

                        </div>


                        <!-- CONTROLS -->

                        <div class="slideshow-controls">

                            <button
                                id="previousPage"
                                class="slide-button previous-button"
                            >
                                ◀ Previous
                            </button>


                            <button
                                id="slideshowButton"
                                class="slide-button slideshow-button"
                            >
                                ▶ Start Slideshow
                            </button>


                            <button
                                id="nextPage"
                                class="slide-button next-button"
                            >
                                Next ▶
                            </button>

                        </div>


                        <!-- IMAGE -->

                        <div
                            id="imageContainer"
                            class="question-image-wrapper"
                        >

                            <img
                                id="questionPageImage"
                                src=""
                                alt="Question Paper"
                            >

                        </div>


                        <!-- PDF -->

                        <div
                            id="pdfContainer"
                            style="display: none;"
                        >

                            <iframe
                                id="questionPdf"
                                title="Question Paper PDF"
                            ></iframe>

                        </div>


                        <div
                            id="paperError"
                            class="error-message"
                            style="display: none;"
                        ></div>

                    </div>

                </div>

            </div>


            <a
                href="exams.html"
                class="back-button"
            >
                ← Back to Exams
            </a>

        </div>

    </section>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <script>

        /* =========================================
           GLOBAL VARIABLES
        ========================================= */

        let exam = null;

        let remainingSeconds = 0;

        let timerInterval = null;

        let examStarted = false;

        let questionPages = [];

        let currentPage = 0;

        let slideshowInterval = null;


        /* =========================================
           GET EXAM ID FROM URL
        ========================================= */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const examId =
            urlParams.get("id");


        /* =========================================
           LOAD EXAM
        ========================================= */

        async function loadExam() {

            const titleElement =
                document.getElementById(
                    "examTitle"
                );

            const messageElement =
                document.getElementById(
                    "examMessage"
                );


            try {

                let query =
                    supabaseClient
                        .from("exams")
                        .select("*")
                        .eq("status", "published");


                if (examId) {

                    query =
                        query.eq(
                            "id",
                            examId
                        );

                }


                query =
                    query
                        .order(
                            "created_at",
                            {
                                ascending: false
                            }
                        )
                        .limit(1);


                const {
                    data,
                    error
                } = await query;


                if (error) {

                    console.error(
                        "SUPABASE ERROR:",
                        error
                    );

                    titleElement.textContent =
                        "❌ Could not load exam";

                    messageElement.style.color =
                        "red";

                    messageElement.textContent =
                        error.message;

                    return;
                }


                if (
                    !data ||
                    data.length === 0
                ) {

                    titleElement.textContent =
                        "📭 No Published Exam";

                    messageElement.style.color =
                        "#555";

                    messageElement.textContent =
                        "There is currently no published examination.";

                    return;
                }


                exam = data[0];


                /*
                    IMPORTANT DEBUG INFORMATION
                */

                console.log(
                    "FULL EXAM DATA:",
                    exam
                );


                /*
                    Find all question-paper pages
                */

                prepareQuestionPages();


                console.log(
                    "QUESTION PAPER PAGES:",
                    questionPages
                );


                displayExam();

            }

            catch (error) {

                console.error(error);

                titleElement.textContent =
                    "❌ Error";

                messageElement.style.color =
                    "red";

                messageElement.textContent =
                    error.message;

            }

        }


        /* =========================================
           PREPARE QUESTION PAPER PAGES
        ========================================= */

        function prepareQuestionPages() {

            questionPages = [];


            /*
                POSSIBLE FIELD 1

                question_paper_urls
            */

            if (
                exam.question_paper_urls
            ) {

                addQuestionPaperValue(
                    exam.question_paper_urls
                );

            }


            /*
                POSSIBLE FIELD 2

                question_paper_url
            */

            if (
                questionPages.length === 0 &&
                exam.question_paper_url
            ) {

                addQuestionPaperValue(
                    exam.question_paper_url
                );

            }


            /*
                POSSIBLE FIELD 3

                question_papers
            */

            if (
                questionPages.length === 0 &&
                exam.question_papers
            ) {

                addQuestionPaperValue(
                    exam.question_papers
                );

            }


            /*
                REMOVE DUPLICATES
            */

            questionPages =
                [...new Set(
                    questionPages
                        .filter(
                            url =>
                                url &&
                                typeof url === "string"
                        )
                        .map(
                            url =>
                                url.trim()
                        )
                )];

        }


        /* =========================================
           ADD QUESTION PAPER VALUE
        ========================================= */

        function addQuestionPaperValue(value) {

            if (!value) {
                return;
            }


            /*
                ARRAY
            */

            if (Array.isArray(value)) {

                value.forEach(
                    item => {

                        addQuestionPaperValue(
                            item
                        );

                    }
                );

                return;
            }


            /*
                STRING
            */

            if (
                typeof value ===
                "string"
            ) {

                const trimmed =
                    value.trim();


                /*
                    JSON ARRAY

                    Example:

                    [
                      "url1",
                      "url2",
                      "url3"
                    ]
                */

                if (
                    trimmed.startsWith("[") &&
                    trimmed.endsWith("]")
                ) {

                    try {

                        const parsed =
                            JSON.parse(
                                trimmed
                            );


                        if (
                            Array.isArray(
                                parsed
                            )
                        ) {

                            parsed.forEach(
                                item => {

                                    addQuestionPaperValue(
                                        item
                                    );

                                }
                            );

                            return;
                        }

                    }

                    catch (error) {

                        console.log(
                            "Not JSON array."
                        );

                    }

                }


                /*
                    JSON OBJECT
                */

                if (
                    trimmed.startsWith("{") &&
                    trimmed.endsWith("}")
                ) {

                    try {

                        const parsed =
                            JSON.parse(
                                trimmed
                            );


                        if (
                            parsed
                        ) {

                            /*
                                Try common properties
                            */

                            if (
                                parsed.url
                            ) {

                                addQuestionPaperValue(
                                    parsed.url
                                );

                            }

                            if (
                                parsed.urls
                            ) {

                                addQuestionPaperValue(
                                    parsed.urls
                                );

                            }

                            if (
                                parsed.pages
                            ) {

                                addQuestionPaperValue(
                                    parsed.pages
                                );

                            }

                            return;
                        }

                    }

                    catch (error) {

                        console.log(
                            "Not JSON object."
                        );

                    }

                }


                /*
                    If normal URL,
                    add it.
                */

                if (
                    trimmed.startsWith(
                        "http"
                    )
                ) {

                    questionPages.push(
                        trimmed
                    );

                }

            }

        }


        /* =========================================
           DISPLAY EXAM
        ========================================= */

        function displayExam() {

            document.getElementById(
                "examTitle"
            ).textContent =
                "📝 " + exam.title;


            document.getElementById(
                "examSubject"
            ).textContent =
                exam.subject ||
                "Not specified";


            document.getElementById(
                "examDate"
            ).textContent =
                exam.exam_date ||
                "Not specified";


            document.getElementById(
                "examDuration"
            ).textContent =
                formatDuration(
                    exam.duration_minutes
                );


            document.getElementById(
                "totalMarks"
            ).textContent =
                exam.total_marks ||
                75;


            document.getElementById(
                "examInstructions"
            ).textContent =
                exam.instructions ||
                "Read all questions carefully before starting the examination.";


            document.getElementById(
                "examContent"
            ).style.display =
                "block";


            /*
                TIMER
            */

            remainingSeconds =
                Number(
                    exam.duration_minutes
                ) * 60;


            updateTimer();


            /*
                QUESTION PAPER CHECK
            */

            if (
                questionPages.length === 0
            ) {

                console.error(
                    "NO QUESTION PAPER URL FOUND."
                );

            }

        }


        /* =========================================
           FORMAT DURATION
        ========================================= */

        function formatDuration(
            minutes
        ) {

            minutes =
                Number(minutes);


            if (minutes === 30) {
                return "30 Minutes";
            }

            if (minutes === 45) {
                return "45 Minutes";
            }

            if (minutes === 60) {
                return "1 Hour";
            }

            if (minutes === 90) {
                return "1 Hour 30 Minutes";
            }

            if (minutes === 120) {
                return "2 Hours";
            }

            if (minutes === 150) {
                return "2 Hours 30 Minutes";
            }

            if (minutes === 180) {
                return "3 Hours";
            }


            const hours =
                Math.floor(
                    minutes / 60
                );


            const mins =
                minutes % 60;


            if (hours > 0) {

                return (
                    hours +
                    (
                        hours > 1
                            ? " Hours "
                            : " Hour "
                    ) +
                    mins +
                    " Minutes"
                );

            }


            return (
                minutes +
                " Minutes"
            );

        }


        /* =========================================
           START EXAM
        ========================================= */

        document
            .getElementById(
                "startExamButton"
            )
            .addEventListener(
                "click",
                function () {

                    if (examStarted) {
                        return;
                    }


                    if (!exam) {

                        alert(
                            "Exam is still loading."
                        );

                        return;
                    }


                    if (
                        questionPages.length === 0
                    ) {

                        alert(
                            "❌ Question paper is not available."
                        );

                        return;
                    }


                    examStarted = true;


                    const button =
                        document.getElementById(
                            "startExamButton"
                        );


                    button.disabled = true;

                    button.textContent =
                        "🟢 Exam Started";


                    /*
                        SHOW PAPER
                    */

                    showQuestionPaper();


                    /*
                        START TIMER
                    */

                    timerInterval =
                        setInterval(
                            function () {

                                if (
                                    remainingSeconds >
                                    0
                                ) {

                                    remainingSeconds--;

                                    updateTimer();

                                }

                                else {

                                    finishExam();

                                }

                            },
                            1000
                        );

                }
            );


        /* =========================================
           UPDATE TIMER
        ========================================= */

        function updateTimer() {

            const timer =
                document.getElementById(
                    "timer"
                );


            const hours =
                Math.floor(
                    remainingSeconds /
                    3600
                );


            const minutes =
                Math.floor(
                    (
                        remainingSeconds %
                        3600
                    ) / 60
                );


            const seconds =
                remainingSeconds %
                60;


            timer.textContent =
                String(hours)
                    .padStart(2, "0") +
                ":" +
                String(minutes)
                    .padStart(2, "0") +
                ":" +
                String(seconds)
                    .padStart(2, "0");


            if (
                remainingSeconds <= 300
            ) {

                timer.style.color =
                    "red";

            }

            else {

                timer.style.color =
                    "black";

            }

        }


        /* =========================================
           SHOW QUESTION PAPER
        ========================================= */

        function showQuestionPaper() {

            const area =
                document.getElementById(
                    "questionPaperArea"
                );


            area.style.display =
                "block";


            if (
                questionPages.length === 0
            ) {

                showPaperError(
                    "❌ No question-paper pages were found."
                );

                return;
            }


            /*
                CREATE SLIDESHOW
            */

            showPage(
                currentPage
            );

        }


        /* =========================================
           SHOW PAGE
        ========================================= */

        function showPage(
            pageIndex
        ) {

            if (
                questionPages.length === 0
            ) {
                return;
            }


            if (
                pageIndex < 0
            ) {

                pageIndex =
                    questionPages.length - 1;

            }


            if (
                pageIndex >=
                questionPages.length
            ) {

                pageIndex = 0;

            }


            currentPage =
                pageIndex;


            const url =
                questionPages[
                    currentPage
                ];


            console.log(
                "SHOWING PAGE:",
                currentPage + 1,
                url
            );


            document.getElementById(
                "currentPageNumber"
            ).textContent =
                currentPage + 1;


            document.getElementById(
                "totalPageNumber"
            ).textContent =
                questionPages.length;


            /*
                PDF
            */

            if (
                url
                    .toLowerCase()
                    .includes(".pdf")
            ) {

                document.getElementById(
                    "imageContainer"
                ).style.display =
                    "none";


                document.getElementById(
                    "pdfContainer"
                ).style.display =
                    "block";


                document.getElementById(
                    "questionPdf"
                ).src =
                    url;

            }


            /*
                IMAGE
            */

            else {

                document.getElementById(
                    "pdfContainer"
                ).style.display =
                    "none";


                document.getElementById(
                    "imageContainer"
                ).style.display =
                    "block";


                const image =
                    document.getElementById(
                        "questionPageImage"
                    );


                image.src = url;


                image.alt =
                    "Question Paper Page " +
                    (
                        currentPage + 1
                    );


                image.onerror =
                    function () {

                        showPaperError(
                            "❌ Could not load this question-paper page."
                        );

                    };


                image.onload =
                    function () {

                        hidePaperError();

                    };

            }


            updateNavigation();

        }


        /* =========================================
           NEXT PAGE
        ========================================= */

        function nextPage() {

            if (
                questionPages.length <= 1
            ) {
                return;
            }


            let next =
                currentPage + 1;


            if (
                next >=
                questionPages.length
            ) {

                next = 0;

            }


            showPage(next);

        }


        /* =========================================
           PREVIOUS PAGE
        ========================================= */

        function previousPage() {

            if (
                questionPages.length <= 1
            ) {
                return;
            }


            let previous =
                currentPage - 1;


            if (
                previous < 0
            ) {

                previous =
                    questionPages.length - 1;

            }


            showPage(previous);

        }


        /* =========================================
           NAVIGATION BUTTONS
        ========================================= */

        function updateNavigation() {

            const previous =
                document.getElementById(
                    "previousPage"
                );


            const next =
                document.getElementById(
                    "nextPage"
                );


            if (
                questionPages.length <= 1
            ) {

                previous.style.display =
                    "none";

                next.style.display =
                    "none";

            }

            else {

                previous.style.display =
                    "inline-block";

                next.style.display =
                    "inline-block";

            }

        }


        /* =========================================
           START / STOP SLIDESHOW
        ========================================= */

        function toggleSlideshow() {

            const button =
                document.getElementById(
                    "slideshowButton"
                );


            /*
                STOP
            */

            if (
                slideshowInterval
            ) {

                clearInterval(
                    slideshowInterval
                );


                slideshowInterval =
                    null;


                button.textContent =
                    "▶ Start Slideshow";


                button.classList.remove(
                    "stop-button"
                );


                button.classList.add(
                    "slideshow-button"
                );


                return;
            }


            /*
                START
            */

            if (
                questionPages.length <= 1
            ) {

                alert(
                    "Only one question-paper page is available."
                );

                return;
            }


            button.textContent =
                "⏸ Stop Slideshow";


            button.classList.remove(
                "slideshow-button"
            );


            button.classList.add(
                "stop-button"
            );


            /*
                Change every 5 seconds
            */

            slideshowInterval =
                setInterval(
                    function () {

                        nextPage();

                    },
                    5000
                );

        }


        /* =========================================
           BUTTON EVENTS
        ========================================= */

        document
            .getElementById(
                "previousPage"
            )
            .addEventListener(
                "click",
                previousPage
            );


        document
            .getElementById(
                "nextPage"
            )
            .addEventListener(
                "click",
                nextPage
            );


        document
            .getElementById(
                "slideshowButton"
            )
            .addEventListener(
                "click",
                toggleSlideshow
            );


        /* =========================================
           PAPER ERROR
        ========================================= */

        function showPaperError(
            message
        ) {

            const error =
                document.getElementById(
                    "paperError"
                );


            error.textContent =
                message;


            error.style.display =
                "block";

        }


        function hidePaperError() {

            const error =
                document.getElementById(
                    "paperError"
                );


            error.style.display =
                "none";

        }


        /* =========================================
           FINISH EXAM
        ========================================= */

        function finishExam() {

            if (
                timerInterval
            ) {

                clearInterval(
                    timerInterval
                );

                timerInterval =
                    null;

            }


            if (
                slideshowInterval
            ) {

                clearInterval(
                    slideshowInterval
                );

                slideshowInterval =
                    null;

            }


            remainingSeconds = 0;


            updateTimer();


            const button =
                document.getElementById(
                    "startExamButton"
                );


            button.disabled =
                true;


            button.textContent =
                "⛔ Exam Finished";


            const slideButton =
                document.getElementById(
                    "slideshowButton"
                );
