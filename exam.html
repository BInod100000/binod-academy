<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Binod Academy - Exam</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .exam-container {
            max-width: 1000px;
            margin: 30px auto;
        }

        .exam-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        .exam-title {
            color: #1565c0;
            margin-bottom: 20px;
        }

        .exam-info {
            font-size: 19px;
            line-height: 1.8;
        }

        #timer {
            font-size: 32px;
            font-weight: bold;
            margin: 25px 0;
        }

        #startExamButton {
            background: #1565c0;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        #startExamButton:hover {
            background: #0d47a1;
        }

        #startExamButton:disabled {
            background: #777;
            cursor: not-allowed;
        }

        #questionPaperArea {
            display: none;
            margin-top: 35px;
        }

        .question-paper-box {
            background: #f5f7fb;
            padding: 25px;
            border-radius: 15px;
        }

        .question-paper-title {
            color: #1565c0;
            margin-bottom: 10px;
        }

        #pageNumber {
            font-size: 22px;
            font-weight: bold;
            margin: 15px 0;
        }

        #questionPaperImage {
            display: block;
            width: 100%;
            max-width: 900px;
            max-height: 750px;
            object-fit: contain;
            margin: 20px auto;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
        }

        .slideshow-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .slide-button {
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            color: white;
        }

        #previousButton {
            background: #777;
        }

        #nextButton {
            background: #1565c0;
        }

        #slideshowButton {
            background: #2e7d32;
        }

        .slide-button:disabled {
            background: #bbb !important;
            cursor: not-allowed;
        }

        .message {
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0;
        }

        .instructions {
            background: #f5f7fb;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            line-height: 1.7;
            margin-top: 25px;
        }

        .back-button {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
        }

        .error-message {
            color: red;
            font-weight: bold;
            padding: 20px;
        }

        @media (max-width: 600px) {

            .exam-card {
                padding: 20px;
            }

            .exam-info {
                font-size: 17px;
            }

            #timer {
                font-size: 26px;
            }

            #questionPaperImage {
                max-height: 600px;
            }

            .slide-button {
                width: 100%;
                max-width: 300px;
            }

        }

    </style>

</head>


<body>

    <h1>🎓 Binod Academy</h1>


    <nav>

        <a href="index.html">🏠 Home</a>

        <a href="exams.html">📝 Exams</a>

        <a href="notes.html">📚 Notes</a>

        <a href="results.html">📊 Results</a>

        <a href="contact.html">📞 Contact</a>

        <a href="login.html">🔐 Login</a>

    </nav>


    <section class="exam-container">

        <div class="exam-card">


            <h2
                id="examTitle"
                class="exam-title"
            >
                ⏳ Loading exam...
            </h2>


            <div
                id="examMessage"
                class="message"
            ></div>


            <div
                id="examContent"
                style="display:none;"
            >


                <div class="exam-info">

                    <p>
                        📚
                        <strong>Subject:</strong>
                        <span id="examSubject"></span>
                    </p>

                    <p>
                        📅
                        <strong>Exam Date:</strong>
                        <span id="examDate"></span>
                    </p>

                    <p>
                        ⏱️
                        <strong>Duration:</strong>
                        <span id="examDuration"></span>
                    </p>

                    <p>
                        📊
                        <strong>Total Marks:</strong>
                        <span id="totalMarks"></span>
                    </p>

                </div>


                <div class="instructions">

                    <strong>
                        📜 Examination Instructions
                    </strong>

                    <p id="examInstructions"></p>

                </div>


                <br>


                <p>
                    Read all instructions carefully
                    before starting.
                </p>


                <button id="startExamButton">

                    ▶️ Start Exam

                </button>


                <p id="timer">
                    00:00:00
                </p>


                <!-- QUESTION PAPER -->

                <div id="questionPaperArea">

                    <div class="question-paper-box">

                        <h2 class="question-paper-title">
                            📄 Question Paper
                        </h2>


                        <div id="pageNumber">
                            Page 0 of 0
                        </div>


                        <img
                            id="questionPaperImage"
                            src=""
                            alt="Question Paper"
                        >


                        <div class="slideshow-controls">

                            <button
                                id="previousButton"
                                class="slide-button"
                            >
                                ◀ Previous
                            </button>


                            <button
                                id="slideshowButton"
                                class="slide-button"
                            >
                                ▶ Start Slideshow
                            </button>


                            <button
                                id="nextButton"
                                class="slide-button"
                            >
                                Next ▶
                            </button>

                        </div>

                    </div>

                </div>


            </div>


            <a
                href="exams.html"
                class="back-button"
            >
                ← Back to Exams
            </a>


        </div>

    </section>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <script>

        /* =====================================================
           GLOBAL VARIABLES
        ===================================================== */

        let exam = null;

        let questionPaperPages = [];

        let currentPage = 0;

        let slideshowInterval = null;

        let remainingSeconds = 0;

        let timerInterval = null;

        let examStarted = false;


        /* =====================================================
           GET EXAM ID
        ===================================================== */

        const urlParams =
            new URLSearchParams(window.location.search);

        const examId =
            urlParams.get("id");


        /* =====================================================
           LOAD EXAM
        ===================================================== */

        async function loadExam() {

            const titleElement =
                document.getElementById("examTitle");

            const messageElement =
                document.getElementById("examMessage");


            try {

                let query =
                    supabaseClient
                        .from("exams")
                        .select("*")
                        .eq("status", "published");


                if (examId) {

                    query =
                        query.eq("id", examId);

                }


                query =
                    query
                        .order("created_at", {
                            ascending: false
                        })
                        .limit(1);


                const {
                    data,
                    error
                } = await query;


                if (error) {

                    console.error(error);

                    titleElement.textContent =
                        "❌ Could not load exam";

                    messageElement.style.color =
                        "red";

                    messageElement.textContent =
                        error.message;

                    return;

                }


                if (!data || data.length === 0) {

                    titleElement.textContent =
                        "📭 No Published Exam";

                    messageElement.textContent =
                        "There is currently no published examination.";

                    return;

                }


                exam = data[0];


                console.log(
                    "Exam loaded:",
                    exam
                );


                prepareQuestionPaperPages();


                displayExam();


            } catch (error) {

                console.error(error);

                titleElement.textContent =
                    "❌ Error";

                messageElement.style.color =
                    "red";

                messageElement.textContent =
                    error.message;

            }

        }


        /* =====================================================
           GET ALL QUESTION PAPER PAGES
        ===================================================== */

        function prepareQuestionPaperPages() {

            questionPaperPages = [];


            /*
             * FIRST:
             * Try question_paper_urls
             */

            if (exam.question_paper_urls) {

                let urls =
                    exam.question_paper_urls;


                /*
                 * If Supabase returns JSONB
                 * as an actual array
                 */

                if (Array.isArray(urls)) {

                    questionPaperPages =
                        urls.filter(Boolean);

                }


                /*
                 * If JSONB is returned as string
                 */

                else if (
                    typeof urls === "string"
                ) {

                    try {

                        const parsed =
                            JSON.parse(urls);

                        if (Array.isArray(parsed)) {

                            questionPaperPages =
                                parsed.filter(Boolean);

                        }

                    } catch (error) {

                        console.error(
                            "Could not parse question_paper_urls",
                            error
                        );

                    }

                }

            }


            /*
             * FALLBACK:
             * Old question_paper_url
             */

            if (
                questionPaperPages.length === 0 &&
                exam.question_paper_url
            ) {

                /*
                 * Sometimes old field
                 * may contain JSON array
                 */

                if (
                    typeof exam.question_paper_url ===
                    "string" &&
                    exam.question_paper_url.trim().startsWith("[")
                ) {

                    try {

                        const parsed =
                            JSON.parse(
                                exam.question_paper_url
                            );

                        if (Array.isArray(parsed)) {

                            questionPaperPages =
                                parsed.filter(Boolean);

                        }

                    } catch (error) {

                        console.error(error);

                    }

                }


                /*
                 * Otherwise it is one URL.
                 */

                if (
                    questionPaperPages.length === 0
                ) {

                    questionPaperPages = [
                        exam.question_paper_url
                    ];

                }

            }


            console.log(
                "Question paper pages:",
                questionPaperPages
            );

        }


        /* =====================================================
           DISPLAY EXAM
        ===================================================== */

        function displayExam() {

            document.getElementById(
                "examTitle"
            ).textContent =
                "📝 " + exam.title;


            document.getElementById(
                "examSubject"
            ).textContent =
                exam.subject || "Not specified";


            document.getElementById(
                "examDate"
            ).textContent =
                exam.exam_date || "Not specified";


            document.getElementById(
                "examDuration"
            ).textContent =
                formatDuration(
                    exam.duration_minutes
                );


            document.getElementById(
                "totalMarks"
            ).textContent =
                exam.total_marks || 75;


            document.getElementById(
                "examInstructions"
            ).textContent =
                exam.instructions ||
                "Read all questions carefully before starting the examination.";


            document.getElementById(
                "examContent"
            ).style.display =
                "block";


            remainingSeconds =
                Number(
                    exam.duration_minutes
                ) * 60;


            updateTimer();


            if (
                questionPaperPages.length === 0
            ) {

                document.getElementById(
                    "examMessage"
                ).innerHTML =
                    "<span class='error-message'>⚠️ Question paper is not available.</span>";

            }

        }


        /* =====================================================
           FORMAT DURATION
        ===================================================== */

        function formatDuration(minutes) {

            minutes = Number(minutes);


            if (minutes === 30)
                return "30 Minutes";


            if (minutes === 45)
                return "45 Minutes";


            if (minutes === 60)
                return "1 Hour";


            if (minutes === 90)
                return "1 Hour 30 Minutes";


            if (minutes === 120)
                return "2 Hours";


            if (minutes === 150)
                return "2 Hours 30 Minutes";


            if (minutes === 180)
                return "3 Hours";


            const hours =
                Math.floor(minutes / 60);


            const mins =
                minutes % 60;


            if (hours > 0) {

                return (
                    hours +
                    " Hour" +
                    (hours > 1 ? "s " : " ") +
                    mins +
                    " Minutes"
                );

            }


            return minutes + " Minutes";

        }


        /* =====================================================
           START EXAM
        ===================================================== */

        document
            .getElementById("startExamButton")
            .addEventListener(
                "click",
                function () {

                    if (examStarted) {
                        return;
                    }


                    if (!exam) {

                        alert(
                            "Exam is still loading."
                        );

                        return;

                    }


                    if (
                        questionPaperPages.length === 0
                    ) {

                        alert(
                            "❌ Question paper is not available."
                        );

                        return;

                    }


                    examStarted = true;


                    const button =
                        document.getElementById(
                            "startExamButton"
                        );


                    button.disabled = true;


                    button.textContent =
                        "🟢 Exam Started";


                    /*
                     * Show first page
                     */

                    showQuestionPaper();


                    /*
                     * Start timer
                     */

                    timerInterval =
                        setInterval(
                            function () {

                                if (
                                    remainingSeconds > 0
                                ) {

                                    remainingSeconds--;

                                    updateTimer();

                                } else {

                                    finishExam();

                                }

                            },
                            1000
                        );

                }
            );


        /* =====================================================
           UPDATE TIMER
        ===================================================== */

        function updateTimer() {

            const timer =
                document.getElementById(
                    "timer"
                );


            const hours =
                Math.floor(
                    remainingSeconds / 3600
                );


            const minutes =
                Math.floor(
                    (remainingSeconds % 3600) / 60
                );


            const seconds =
                remainingSeconds % 60;


            timer.textContent =
                String(hours).padStart(2, "0") +
                ":" +
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0");


            if (
                remainingSeconds <= 300
            ) {

                timer.style.color =
                    "red";

            }

        }


        /* =====================================================
           SHOW QUESTION PAPER
        ===================================================== */

        function showQuestionPaper() {

            const area =
                document.getElementById(
                    "questionPaperArea"
                );


            area.style.display =
                "block";


            currentPage = 0;


            displayCurrentPage();


        }


        /* =====================================================
           DISPLAY CURRENT PAGE
        ===================================================== */

        function displayCurrentPage() {

            if (
                questionPaperPages.length === 0
            ) {

                return;

            }


            const image =
                document.getElementById(
                    "questionPaperImage"
                );


            const pageNumber =
                document.getElementById(
                    "pageNumber"
                );


            image.src =
                questionPaperPages[currentPage];


            pageNumber.textContent =
                "Page " +
                (currentPage + 1) +
                " of " +
                questionPaperPages.length;


            /*
             * Previous button
             */

            document.getElementById(
                "previousButton"
            ).disabled =
                currentPage === 0;


            /*
             * Next button
             */

            document.getElementById(
                "nextButton"
            ).disabled =
                currentPage ===
                questionPaperPages.length - 1;

        }


        /* =====================================================
           NEXT PAGE
        ===================================================== */

        document
            .getElementById("nextButton")
            .addEventListener(
                "click",
                function () {

                    if (
                        currentPage <
                        questionPaperPages.length - 1
                    ) {

                        currentPage++;

                        displayCurrentPage();

                    }

                }
            );


        /* =====================================================
           PREVIOUS PAGE
        ===================================================== */

        document
            .getElementById("previousButton")
            .addEventListener(
                "click",
                function () {

                    if (
                        currentPage > 0
                    ) {

                        currentPage--;

                        displayCurrentPage();

                    }

                }
            );


        /* =====================================================
           START / STOP SLIDESHOW
        ===================================================== */

        document
            .getElementById("slideshowButton")
            .addEventListener(
                "click",
                function () {

                    const button =
                        document.getElementById(
                            "slideshowButton"
                        );


                    /*
                     * Stop slideshow
                     */

                    if (slideshowInterval) {

                        clearInterval(
                            slideshowInterval
                        );

                        slideshowInterval =
                            null;

                        button.textContent =
                            "▶ Start Slideshow";

                        button.style.background =
                            "#2e7d32";

                        return;

                    }


                    /*
                     * Don't start if only one page
                     */

                    if (
                        questionPaperPages.length <= 1
                    ) {

                        alert(
                            "Only one question-paper page is available."
                        );

                        return;

                    }


                    /*
                     * Start slideshow
                     */

                    button.textContent =
                        "⏸ Stop Slideshow";

                    button.style.background =
                        "#d32f2f";


                    slideshowInterval =
                        setInterval(
                            function () {

                                currentPage++;


                                /*
                                 * Return to first page
                                 */

                                if (
                                    currentPage >=
                                    questionPaperPages.length
                                ) {

                                    currentPage = 0;

                                }


                                displayCurrentPage();

                            },
                            5000
                        );

                }
            );


        /* =====================================================
           FINISH EXAM
        ===================================================== */

        function finishExam() {

            clearInterval(
                timerInterval
            );


            remainingSeconds = 0;


            updateTimer();


            document.getElementById(
                "startExamButton"
            ).disabled = true;


            document.getElementById(
                "startExamButton"
            ).textContent =
                "⛔ Exam Finished";


            if (slideshowInterval) {

                clearInterval(
                    slideshowInterval
                );

                slideshowInterval =
                    null;

            }


            alert(
                "⏰ Examination time is over."
            );

        }


        /* =====================================================
           LOAD EXAM
        ===================================================== */

        loadExam();

    </script>

</body>

</html>
