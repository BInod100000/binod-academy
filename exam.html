<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Binod Academy - Exam</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .exam-container {
            max-width: 900px;
            margin: 30px auto;
        }

        .exam-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        .exam-title {
            color: #1565c0;
            margin-bottom: 20px;
        }

        .exam-info {
            font-size: 19px;
            line-height: 1.8;
        }

        #timer {
            font-size: 32px;
            font-weight: bold;
            margin: 25px 0;
        }

        #startExamButton {
            background: #1565c0;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        #startExamButton:hover {
            background: #0d47a1;
        }

        #questionPaperArea {
            display: none;
            margin-top: 30px;
        }

        #questionPaperArea iframe {
            width: 100%;
            height: 700px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }

        #questionPaperArea img {
            max-width: 100%;
            border-radius: 10px;
        }

        .message {
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0;
        }

        .instructions {
            background: #f5f7fb;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            line-height: 1.7;
            margin-top: 25px;
            white-space: pre-line;
        }

        .back-button {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
        }
    </style>
</head>


<body>

<h1>🎓 Binod Academy</h1>

<nav>
    <a href="index.html">🏠 Home</a>
    <a href="exams.html">📝 Exams</a>
    <a href="notes.html">📚 Notes</a>
    <a href="results.html">📊 Results</a>
    <a href="contact.html">📞 Contact</a>
    <a href="login.html">🔐 Login</a>
</nav>


<section class="exam-container">

    <div class="exam-card">

        <h2 id="examTitle" class="exam-title">
            ⏳ Loading exam...
        </h2>

        <div id="examMessage" class="message"></div>

        <div id="examContent" style="display:none;">

            <div class="exam-info">

                <p>
                    📚 <strong>Subject:</strong>
                    <span id="examSubject"></span>
                </p>

                <p>
                    📅 <strong>Exam Date:</strong>
                    <span id="examDate"></span>
                </p>

                <p>
                    ⏱️ <strong>Duration:</strong>
                    <span id="examDuration"></span>
                </p>

                <p>
                    📊 <strong>Total Marks:</strong>
                    <span id="totalMarks"></span>
                </p>

            </div>


            <div class="instructions">

                <strong>📜 Examination Instructions</strong>

                <p id="examInstructions"></p>

            </div>


            <br>

            <p>
                Read all instructions carefully before starting.
            </p>


            <button id="startExamButton">
                ▶️ Start Exam
            </button>


            <p id="timer">
                00:00:00
            </p>


            <!-- QUESTION PAPER -->

            <div id="questionPaperArea">

                <h2>📄 Question Paper</h2>

                <div id="questionPaperContainer"></div>

            </div>


        </div>


        <a href="exams.html" class="back-button">
            ← Back to Exams
        </a>

    </div>

</section>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

let exam = null;

let remainingSeconds = 0;

let timerInterval = null;

let examStarted = false;


/* =========================================
   GET EXAM ID FROM URL
   ========================================= */

const urlParams = new URLSearchParams(window.location.search);

const examId = urlParams.get("id");


/* =========================================
   LOAD EXAM
   ========================================= */

async function loadExam() {

    const titleElement =
        document.getElementById("examTitle");

    const messageElement =
        document.getElementById("examMessage");

    try {

        let query =
            supabaseClient
                .from("exams")
                .select("*")
                .eq("status", "published");


        /*
         * If an exam ID is supplied,
         * load that exact exam.
         */

        if (examId) {

            query = query.eq("id", examId);

        }


        /*
         * Otherwise load latest published exam.
         */

        query = query
            .order("created_at", {
                ascending: false
            })
            .limit(1);


        const {
            data,
            error
        } = await query;


        if (error) {

            console.error(error);

            titleElement.textContent =
                "❌ Could not load exam";

            messageElement.style.color = "red";

            messageElement.textContent =
                error.message;

            return;
        }


        if (!data || data.length === 0) {

            titleElement.textContent =
                "📭 No Published Exam";

            messageElement.style.color = "#555";

            messageElement.textContent =
                "There is currently no published examination.";

            return;
        }


        exam = data[0];


        displayExam();


    } catch (error) {

        console.error(error);

        titleElement.textContent =
            "❌ Error";

        messageElement.style.color = "red";

        messageElement.textContent =
            error.message;

    }

}


/* =========================================
   DISPLAY EXAM
   ========================================= */

function displayExam() {

    document.getElementById("examTitle").textContent =
        "📝 " + exam.title;


    document.getElementById("examSubject").textContent =
        exam.subject || "Not specified";


    document.getElementById("examDate").textContent =
        exam.exam_date || "Not specified";


    document.getElementById("examDuration").textContent =
        formatDuration(exam.duration_minutes);


    document.getElementById("totalMarks").textContent =
        exam.total_marks || 75;


    document.getElementById("examInstructions").textContent =
        exam.instructions ||
        "Read all questions carefully before starting the examination.";


    document.getElementById("examContent").style.display =
        "block";


    /*
     * Set timer according to database duration.
     */

    remainingSeconds =
        Number(exam.duration_minutes) * 60;


    updateTimer();


    /*
     * If there is no question paper,
     * tell the teacher/student.
     */

    if (!exam.question_paper_url) {

        document.getElementById("questionPaperContainer").innerHTML =
            "<p style='color:red;'>⚠️ Question paper is not available.</p>";

    }

}


/* =========================================
   FORMAT DURATION
   ========================================= */

function formatDuration(minutes) {

    minutes = Number(minutes);


    if (minutes === 30) {
        return "30 Minutes";
    }

    if (minutes === 45) {
        return "45 Minutes";
    }

    if (minutes === 60) {
        return "1 Hour";
    }

    if (minutes === 90) {
        return "1 Hour 30 Minutes";
    }

    if (minutes === 120) {
        return "2 Hours";
    }

    if (minutes === 150) {
        return "2 Hours 30 Minutes";
    }

    if (minutes === 180) {
        return "3 Hours";
    }


    const hours =
        Math.floor(minutes / 60);

    const mins =
        minutes % 60;


    if (hours > 0) {

        return hours +
            " Hour" +
            (hours > 1 ? "s " : " ") +
            mins +
            " Minutes";

    }


    return minutes + " Minutes";

}


/* =========================================
   START EXAM
   ========================================= */

document.getElementById("startExamButton")
    .addEventListener("click", function () {

        if (examStarted) {
            return;
        }


        if (!exam) {

            alert("Exam is still loading.");

            return;
        }


        if (!exam.question_paper_url) {

            alert(
                "❌ Question paper is not available."
            );

            return;
        }


        examStarted = true;


        /*
         * Disable start button
         */

        const button =
            document.getElementById("startExamButton");

        button.disabled = true;

        button.textContent =
            "🟢 Exam Started";


        /*
         * Show question paper
         */

        showQuestionPaper();


        /*
         * Start timer ONLY NOW.
         */

        timerInterval =
            setInterval(function () {

                if (remainingSeconds > 0) {

                    remainingSeconds--;

                    updateTimer();

                } else {

                    finishExam();

                }

            }, 1000);

});


/* =========================================
   UPDATE TIMER
   ========================================= */

function updateTimer() {

    const timer =
        document.getElementById("timer");


    const hours =
        Math.floor(
            remainingSeconds / 3600
        );


    const minutes =
        Math.floor(
            (remainingSeconds % 3600) / 60
        );


    const seconds =
        remainingSeconds % 60;


    timer.textContent =

        String(hours).padStart(2, "0") +
        ":" +

        String(minutes).padStart(2, "0") +
        ":" +

        String(seconds).padStart(2, "0");


    /*
     * Warning when 5 minutes remain.
     */

    if (remainingSeconds <= 300) {

        timer.style.color = "red";

    }

}


/* =========================================
   SHOW QUESTION PAPER
   ========================================= */

function showQuestionPaper() {

    const area =
        document.getElementById(
            "questionPaperArea"
        );


    const container =
        document.getElementById(
            "questionPaperContainer"
        );


    const url =
        exam.question_paper_url;


    const lowerUrl =
        url.toLowerCase();


    /*
     * PDF
     */

    if (lowerUrl.includes(".pdf")) {

        container.innerHTML =

            `<iframe
                src="${url}"
                title="Question Paper">
            </iframe>`;

    }


    /*
     * IMAGE
     */

    else {

        container.innerHTML =

            `<img
                src="${url}"
                alt="Question Paper">`;

    }


    area.style.display =
        "block";

}


/* =========================================
   FINISH EXAM
   ========================================= */

function finishExam() {

    clearInterval(timerInterval);


    remainingSeconds = 0;

    updateTimer();


    document.getElementById(
        "startExamButton"
    ).disabled = true;


    document.getElementById(
        "startExamButton"
    ).textContent =
        "⛔ Exam Finished";


    alert(
        "⏰ Examination time is over."
    );

}


/* =========================================
   LOAD
   ========================================= */

loadExam();

</script>

</body>
</html>
