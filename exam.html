<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Binod Academy - Examination</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
}

/* =========================
   HEADER
========================= */

header {
    background: white;
    padding: 22px 20px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

header h1 {
    margin: 0;
    color: #1565c0;
    font-size: 34px;
}

header p {
    margin: 8px 0 0;
    color: #666;
    font-size: 18px;
}

/* =========================
   MAIN CONTAINER
========================= */

.container {
    width: min(1100px, 94%);
    margin: 30px auto;
}

/* =========================
   EXAM HEADER
========================= */

.exam-header {
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    margin-bottom: 20px;
    text-align: center;
}

.exam-header h2 {
    margin: 0 0 12px;
    color: #1565c0;
    font-size: 30px;
}

.exam-details {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
    color: #444;
    font-size: 16px;
}

/* =========================
   TIMER
========================= */

.timer-box {
    position: sticky;
    top: 10px;
    z-index: 50;

    background: #1565c0;
    color: white;

    width: fit-content;
    min-width: 180px;

    margin: 0 auto 20px;

    padding: 14px 25px;

    border-radius: 15px;

    text-align: center;

    box-shadow: 0 6px 20px rgba(0,0,0,0.15);

    display: none;
}

.timer-label {
    font-size: 14px;
    opacity: 0.9;
}

.timer {
    font-size: 30px;
    font-weight: bold;
    margin-top: 3px;
}

/* =========================
   PAPER AREA
========================= */

.paper-container {
    background: white;
    border-radius: 18px;
    padding: 20px;

    box-shadow: 0 8px 25px rgba(0,0,0,0.08);

    margin-bottom: 20px;
}

.paper-title {
    text-align: center;
    color: #1565c0;
    margin: 0 0 20px;
    font-size: 24px;
}

/* =========================
   PDF
========================= */

.pdf-viewer {
    width: 100%;
    height: 750px;

    border: none;
    border-radius: 12px;

    background: #eee;

    display: block;
}

/* =========================
   IMAGE PAPER
========================= */

.paper-image {
    width: 100%;
    height: auto;

    display: block;

    margin: 0 auto 20px;

    border-radius: 10px;

    cursor: pointer;

    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

/* =========================
   BUTTONS
========================= */

.button-area {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;

    margin: 25px 0;
}

button {
    border: none;
    cursor: pointer;
    font-family: Arial, sans-serif;
}

.start-btn {
    background: #1565c0;
    color: white;

    padding: 15px 35px;

    border-radius: 12px;

    font-size: 18px;
    font-weight: bold;

    transition: 0.2s;
}

.start-btn:hover {
    background: #0d47a1;
    transform: translateY(-1px);
}

.back-btn {
    background: #eeeeee;
    color: #333;

    padding: 15px 30px;

    border-radius: 12px;

    font-size: 17px;
    font-weight: bold;
}

.back-btn:hover {
    background: #ddd;
}

/* =========================
   START MESSAGE
========================= */

.start-message {
    text-align: center;

    background: #fff8e1;

    border: 1px solid #ffe082;

    color: #6d4c00;

    padding: 18px;

    border-radius: 12px;

    margin-bottom: 20px;

    font-size: 16px;
}

/* =========================
   LOADING
========================= */

.loading {
    background: white;

    padding: 50px 20px;

    border-radius: 18px;

    text-align: center;

    font-size: 20px;

    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

/* =========================
   ERROR
========================= */

.error-box {
    background: white;

    padding: 50px 25px;

    border-radius: 18px;

    text-align: center;

    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.error-box h2 {
    color: #d32f2f;
    margin-top: 0;
}

.error-box p {
    font-size: 17px;
    color: #444;
}

/* =========================
   FULLSCREEN IMAGE
========================= */

.image-modal {
    display: none;

    position: fixed;

    z-index: 9999;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: rgba(0,0,0,0.95);

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.image-modal img {
    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    border-radius: 5px;
}

.close-modal {
    position: absolute;

    top: 15px;
    right: 25px;

    color: white;

    font-size: 42px;

    cursor: pointer;

    z-index: 10000;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    header {
        padding: 18px 12px;
    }

    header h1 {
        font-size: 28px;
    }

    header p {
        font-size: 16px;
    }

    .container {
        width: 94%;
        margin: 18px auto;
    }

    .exam-header {
        padding: 20px 15px;
        border-radius: 15px;
    }

    .exam-header h2 {
        font-size: 24px;
    }

    .exam-details {
        gap: 10px;
        font-size: 14px;
    }

    .paper-container {
        padding: 10px;
        border-radius: 14px;
    }

    .paper-title {
        font-size: 20px;
    }

    .pdf-viewer {
        height: 70vh;
        min-height: 500px;
    }

    .start-btn,
    .back-btn {
        width: 100%;
        padding: 15px;
    }

    .button-area {
        gap: 10px;
    }

    .timer-box {
        width: 100%;
        min-width: 0;
    }

    .timer {
        font-size: 26px;
    }
}

</style>
</head>

<body>

<header>
    <h1>🎓 Binod Academy</h1>
    <p>Online Examination Portal</p>
</header>


<div class="container">

    <div id="mainContent">

        <div class="loading">
            ⏳ Loading examination...
        </div>

    </div>

</div>


<!-- FULLSCREEN IMAGE MODAL -->

<div id="imageModal" class="image-modal">

    <span class="close-modal" onclick="closeImageModal()">
        ×
    </span>

    <img id="modalImage" src="" alt="Question Paper">

</div>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://zapjcweouiohabrmymqq.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_LzpPYJfrnh604E-guWCezA_mzZjaS6x";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let exam = null;

let examId = null;

let durationMinutes = 30;

let remainingSeconds = 0;

let timerInterval = null;

let examStarted = false;


/* =========================================================
   GET EXAM ID FROM URL
========================================================= */

function getExamId() {

    const params = new URLSearchParams(
        window.location.search
    );

    return params.get("id");
}


/* =========================================================
   FIND QUESTION PAPER URL
========================================================= */

function findQuestionPaper(data) {

    if (!data) {
        return null;
    }


    /*
     * First check the most common column names.
     */

    const possibleFields = [

        "question_paper",
        "question_paper_url",
        "questionpaper",
        "questionpaper_url",

        "paper",
        "paper_url",

        "file_url",
        "file",
        "file_path",

        "pdf",
        "pdf_url",
        "pdf_file",

        "question_file",
        "question_file_url",

        "question_paper_file",
        "question_paper_file_url",

        "document",
        "document_url",

        "image",
        "image_url",

        "question_image",
        "question_image_url",

        "questions",
        "questions_url"

    ];


    for (const field of possibleFields) {

        const value = data[field];

        if (!value) {
            continue;
        }


        /*
         * If it is already a normal string.
         */

        if (typeof value === "string") {

            const trimmed = value.trim();

            if (
                trimmed.startsWith("http://") ||
                trimmed.startsWith("https://")
            ) {

                return trimmed;

            }

            /*
             * Sometimes a JSON array is stored as text.
             */

            try {

                const parsed = JSON.parse(trimmed);

                const result =
                    findPaperInsideValue(parsed);

                if (result) {
                    return result;
                }

            } catch (e) {

                /*
                 * Not JSON.
                 */

            }

        }


        /*
         * If Supabase returned an array/object.
         */

        const result =
            findPaperInsideValue(value);

        if (result) {
            return result;
        }

    }


    /*
     * Last-resort automatic search through
     * every field in the exam row.
     */

    for (const key in data) {

        const value = data[key];

        const result =
            findPaperInsideValue(value);

        if (result) {
            return result;
        }

    }


    return null;
}


/* =========================================================
   SEARCH VALUE RECURSIVELY
========================================================= */

function findPaperInsideValue(value) {

    if (!value) {
        return null;
    }


    if (typeof value === "string") {

        const text = value.trim();

        if (
            text.startsWith("http://") ||
            text.startsWith("https://")
        ) {

            return text;

        }

        return null;
    }


    if (Array.isArray(value)) {

        for (const item of value) {

            const result =
                findPaperInsideValue(item);

            if (result) {
                return result;
            }

        }

        return null;
    }


    if (typeof value === "object") {

        for (const key in value) {

            const result =
                findPaperInsideValue(value[key]);

            if (result) {
                return result;
            }

        }

    }


    return null;
}


/* =========================================================
   CHECK WHETHER URL IS PDF
========================================================= */

function isPDF(url) {

    if (!url) {
        return false;
    }

    return (
        url.toLowerCase().includes(".pdf") ||
        url.toLowerCase().includes("application/pdf")
    );

}


/* =========================================================
   LOAD EXAM
========================================================= */

async function loadExam() {

    const mainContent =
        document.getElementById("mainContent");


    examId = getExamId();


    /*
     * No ID
     */

    if (!examId) {

        showError(
            "No Exam ID was received.",
            "Please open the examination from the Exams page."
        );

        return;
    }


    try {

        /*
         * Get all exams.
         *
         * This avoids problems where some databases
         * use UUID IDs and others use numeric IDs.
         */

        const {
            data: exams,
            error
        } = await supabaseClient
            .from("exams")
            .select("*");


        if (error) {
            throw error;
        }


        if (!exams || exams.length === 0) {

            showError(
                "No examinations were found.",
                "Please check your Supabase exams table."
            );

            return;
        }


        /*
         * Find the requested exam.
         */

        exam = exams.find(function(item) {

            return String(item.id) === String(examId);

        });


        if (!exam) {

            showError(
                "Examination not found.",
                "Exam ID: " + examId
            );

            return;
        }


        console.log(
            "Loaded exam:",
            exam
        );


        /*
         * Get exam title.
         */

        const title =
            exam.title ||
            exam.name ||
            "Examination";


        /*
         * Get duration.
         */

        durationMinutes = Number(
            exam.duration_minutes ||
            exam.duration ||
            exam.time_limit ||
            exam.time ||
            30
        );


        if (
            !Number.isFinite(durationMinutes) ||
            durationMinutes <= 0
        ) {

            durationMinutes = 30;

        }


        /*
         * Find question paper.
         */

        const questionPaper =
            findQuestionPaper(exam);


        console.log(
            "Question paper found:",
            questionPaper
        );


        /*
         * If no paper URL exists.
         */

        if (!questionPaper) {

            showError(
                "No question paper was found for this examination.",
                "Exam ID: " + examId +
                ". Please check that the question paper has been uploaded and its URL is saved in the exams table."
            );

            return;
        }


        /*
         * Show examination.
         */

        displayExam(
            title,
            questionPaper
        );

    } catch (error) {

        console.error(
            "Exam loading error:",
            error
        );


        showError(
            "Unable to load this examination.",
            error.message ||
            "Unknown error occurred."
        );

    }

}


/* =========================================================
   DISPLAY EXAM
========================================================= */

function displayExam(title, questionPaper) {

    const mainContent =
        document.getElementById("mainContent");


    mainContent.innerHTML = `

        <div class="exam-header">

            <h2>
                📚 ${escapeHTML(title)}
            </h2>

            <div class="exam-details">

                <span>
                    ⏱️ Duration:
                    <strong>
                        ${durationMinutes} Minutes
                    </strong>
                </span>

                <span>
                    📝 Examination
                </span>

            </div>

        </div>


        <div
            id="timerBox"
            class="timer-box"
        >

            <div class="timer-label">
                Time Remaining
            </div>

            <div
                id="timer"
                class="timer"
            >
                ${formatTime(durationMinutes * 60)}
            </div>

        </div>


        <div
            id="startMessage"
            class="start-message"
        >

            📢 Read the question paper carefully.

            <br>

            Click
            <strong>Start Exam</strong>
            when you are ready.

        </div>


        <div class="paper-container">

            <h3 class="paper-title">
                📄 Question Paper
            </h3>

            <div id="paperViewer"></div>

        </div>


        <div class="button-area">

            <button
                class="start-btn"
                id="startExamButton"
                onclick="startExam()"
            >
                ▶️ Start Exam
            </button>

            <button
                class="back-btn"
                onclick="goBack()"
            >
                ← Back to Exams
            </button>

        </div>

    `;


    renderQuestionPaper(questionPaper);

}


/* =========================================================
   RENDER QUESTION PAPER
========================================================= */

function renderQuestionPaper(url) {

    const viewer =
        document.getElementById("paperViewer");


    if (!viewer) {
        return;
    }


    /*
     * PDF
     */

    if (isPDF(url)) {

        viewer.innerHTML = `

            <iframe
                class="pdf-viewer"
                src="${escapeAttribute(url)}"
                title="Question Paper"
            ></iframe>

        `;

        return;
    }


    /*
     * Image
     */

    viewer.innerHTML = `

        <img
            src="${escapeAttribute(url)}"
            class="paper-image"
            alt="Question Paper"
            onclick="openImageModal(this.src)"
            onerror="imageLoadError(this)"
        >

    `;

}


/* =========================================================
   START EXAM
========================================================= */

function startExam() {

    if (examStarted) {
        return;
    }


    examStarted = true;


    /*
     * Timer starts ONLY now.
     */

    remainingSeconds =
        durationMinutes * 60;


    const timerBox =
        document.getElementById("timerBox");

    const startMessage =
        document.getElementById("startMessage");

    const startButton =
        document.getElementById("startExamButton");


    if (timerBox) {
        timerBox.style.display = "block";
    }


    if (startMessage) {

        startMessage.innerHTML = `
            ✅ Examination started.
            Your timer is now running.
        `;

    }


    if (startButton) {

        startButton.disabled = true;

        startButton.innerHTML =
            "⏱️ Exam Started";

        startButton.style.opacity = "0.7";

    }


    updateTimer();


    timerInterval =
        setInterval(
            updateTimer,
            1000
        );

}


/* =========================================================
   UPDATE TIMER
========================================================= */

function updateTimer() {

    const timer =
        document.getElementById("timer");


    if (!timer) {
        return;
    }


    timer.textContent =
        formatTime(remainingSeconds);


    /*
     * Time finished.
     */

    if (remainingSeconds <= 0) {

        clearInterval(timerInterval);

        timer.textContent =
            "00:00:00";


        alert(
            "⏰ Time is over. The examination has ended."
        );


        return;
    }


    remainingSeconds--;

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(totalSeconds) {

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const seconds =
        totalSeconds % 60;


    return (
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0")
    );

}


/* =========================================================
   IMAGE ERROR
========================================================= */

function imageLoadError(image) {

    image.style.display = "none";


    const viewer =
        document.getElementById("paperViewer");


    viewer.innerHTML = `

        <div class="error-box">

            <h2>
                ❌ Question Paper Could Not Be Displayed
            </h2>

            <p>
                The question paper URL exists,
                but the file could not be loaded.
            </p>

        </div>

    `;

}


/* =========================================================
   FULLSCREEN IMAGE
========================================================= */

function openImageModal(src) {

    const modal =
        document.getElementById("imageModal");

    const image =
        document.getElementById("modalImage");


    image.src = src;

    modal.style.display = "flex";

}


function closeImageModal() {

    const modal =
        document.getElementById("imageModal");


    modal.style.display = "none";

}


/*
 * Close modal when clicking outside image.
 */

document
    .getElementById("imageModal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeImageModal();

            }

        }
    );


/* =========================================================
   BACK TO EXAMS
========================================================= */

function goBack() {

    window.location.href =
        "exams.html";

}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/* =========================================================
   START
========================================================= */

loadExam();

</script>

</body>
</html>
