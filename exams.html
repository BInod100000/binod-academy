<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Binod Academy - Exams</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: white;
            padding: 22px 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            color: #1565c0;
            font-size: 34px;
        }

        header p {
            margin: 8px 0 0;
            color: #666;
            font-size: 16px;
        }

        .container {
            width: min(1100px, 94%);
            margin: 30px auto 50px;
        }

        .page-title {
            text-align: center;
            color: #1565c0;
            font-size: 30px;
            margin: 0 0 25px;
        }

        #examList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
        }

        .exam-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            border: 1px solid #e5eaf0;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .exam-card h2 {
            margin: 0 0 18px;
            color: #1565c0;
            font-size: 23px;
        }

        .exam-info {
            margin: 12px 0;
            font-size: 16px;
            color: #444;
        }

        .start-btn {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #1565c0;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-btn:hover {
            background: #0d47a1;
        }

        .loading,
        .no-exams,
        .error {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .error {
            color: #c62828;
        }

        @media (max-width: 600px) {

            header {
                padding: 18px 12px;
            }

            header h1 {
                font-size: 28px;
            }

            header p {
                font-size: 14px;
            }

            .container {
                width: 92%;
                margin: 20px auto 30px;
            }

            .page-title {
                font-size: 25px;
            }

            #examList {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .exam-card {
                padding: 20px;
                border-radius: 16px;
            }

            .exam-card h2 {
                font-size: 21px;
            }

            .exam-info {
                font-size: 15px;
            }

            .start-btn {
                padding: 15px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 Binod Academy</h1>
    <p>Online Examination Portal</p>
</header>

<div class="container">

    <h2 class="page-title">
        📝 Available Examinations
    </h2>

    <div id="examList">
        <div class="loading">
            ⏳ Loading examinations...
        </div>
    </div>

</div>

<script>
/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://zapjcweouiohabrmymqq.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_LzpPYJfrnh604E-guWCezA_mzZjaS6x";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   EXAM LIST
   ========================================================= */

const examList =
    document.getElementById("examList");


/* =========================================================
   LOAD EXAMS
   ========================================================= */

async function loadExams() {

    examList.innerHTML = `
        <div class="loading">
            ⏳ Loading examinations...
        </div>
    `;

    try {

        const {
            data: exams,
            error
        } = await supabaseClient
            .from("exams")
            .select("*")
            .order("created_at", {
                ascending: false
            });


        if (error) {
            throw error;
        }


        if (!exams || exams.length === 0) {

            examList.innerHTML = `
                <div class="no-exams">
                    <h3>📭 No examinations available</h3>
                    <p>Please check again later.</p>
                </div>
            `;

            return;
        }


        examList.innerHTML = "";


        exams.forEach(exam => {

            /*
             * THIS MUST BE THE REAL SUPABASE UUID.
             */
            const examId = exam.id;


            const title =
                exam.title ||
                exam.name ||
                "Untitled Examination";


            let duration =
                Number(
                    exam.duration ||
                    exam.duration_minutes ||
                    30
                );


            if (!duration || duration < 1) {
                duration = 30;
            }


            duration = Math.min(
                duration,
                180
            );


            const totalMarks =
                exam.total_marks ??
                exam.marks ??
                0;


            const card =
                document.createElement("div");

            card.className =
                "exam-card";


            card.innerHTML = `
                <h2>
                    📚 ${escapeHTML(title)}
                </h2>

                <div class="exam-info">
                    ⏱️ <strong>Duration:</strong>
                    ${duration} Minutes
                </div>

                <div class="exam-info">
                    📊 <strong>Total Marks:</strong>
                    ${escapeHTML(String(totalMarks))}
                </div>

                <button
                    type="button"
                    class="start-btn">
                    📝 Start Exam
                </button>
            `;


            const button =
                card.querySelector(".start-btn");


            button.addEventListener(
                "click",
                function () {

                    openExam(examId);

                }
            );


            examList.appendChild(card);

        });


    } catch (error) {

        console.error(
            "Exam loading error:",
            error
        );


        examList.innerHTML = `
            <div class="error">

                <h3>
                    ❌ Could not load examinations
                </h3>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>
        `;

    }
}


/* =========================================================
   OPEN EXAM
   ========================================================= */

function openExam(examId) {

    if (!examId) {

        alert(
            "❌ This examination has no valid ID."
        );

        return;
    }


    /*
     * Save the UUID as an additional backup.
     */
    sessionStorage.setItem(
        "binodAcademyExamId",
        examId
    );


    localStorage.setItem(
        "binodAcademyExamId",
        examId
    );


    /*
     * Build exam.html URL correctly.
     *
     * This works even if the website is inside
     * a GitHub Pages repository.
     */

    const basePath =
        window.location.pathname
            .substring(
                0,
                window.location.pathname.lastIndexOf("/") + 1
            );


    const examUrl =
        basePath +
        "exam.html?id=" +
        encodeURIComponent(examId);


    console.log(
        "Opening examination:",
        examId
    );

    console.log(
        "Exam URL:",
        examUrl
    );


    window.location.href =
        examUrl;
}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   START
   ========================================================= */

loadExams();

</script>

</body>
</html>
